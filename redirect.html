<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Accediendo a tu promoción...</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f0f0; }
        .message { text-align: center; padding: 20px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .aviso-ubicacion { font-size: 0.85em; color: #555; margin-top: 15px; line-height: 1.4; max-width: 300px; margin-left: auto; margin-right: auto; }
    </style>
</head>
<body>
    <div class="message">
        <div class="spinner"></div>
        <p id="status-message">Verificando enlace, por favor espere...</p>
        <div class="aviso-ubicacion">
            💡 <strong>¿Pronto te pediremos tu ubicación?</strong><br>
            Autorízala para acceder a promociones y beneficios exclusivos disponibles en tu zona. ¡Es rápido y seguro!
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBWnsIrC7TwKib6z69y8dELBVEs0Zgov4I",
            authDomain: "qr-tracker-d506d.firebaseapp.com",
            projectId: "qr-tracker-d506d",
            storageBucket: "qr-tracker-d506d.firebasestorage.app",
            messagingSenderId: "718659152932",
            appId: "1:718659152932:web:d3945cdc4a963c5f8e3cb1"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const urlParams = new URLSearchParams(window.location.search);
        const qrId = urlParams.get('id') || 'desconocido';

        const destinosFijos = {
            "promo1": "https://google.com",
            "promo2": "https://youtube.com",
            "whatsapp1": "https://wa.link/sr53o3"
        };

        async function procesarEscaneo() {
            let urlFinal = destinosFijos[qrId] || "https://google.com";

            // 1. Intentar buscar en Firebase
            try {
                const doc = await db.collection('campaigns').doc(qrId).get();
                if (doc.exists) {
                    urlFinal = doc.data().url;
                }
            } catch (e) {
                console.error("Error buscando campaña", e);
            }

            // 2. Pedir Ubicación GPS
            let lat = null, lon = null, accuracy = null;
            if (navigator.geolocation) {
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 });
                    });
                    lat = pos.coords.latitude;
                    lon = pos.coords.longitude;
                    accuracy = pos.coords.accuracy;
                } catch (err) {
                    console.log("Ubicación denegada");
                }
            }

            // 3. Guardar Estadística en Firebase (CON ALERTAS DE ERROR)
            try {
                document.getElementById('status-message').innerText = "Guardando estadística...";
                await db.collection('scans').add({
                    qrId: qrId,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    userAgent: navigator.userAgent,
                    lat: lat,
                    lon: lon,
                    accuracy: accuracy,
                    urlDestino: urlFinal
                });
                // Si llega aquí, guardó bien. Redirigimos.
                window.location.href = urlFinal;
            } catch (e) {
                console.error("Error al guardar escaneo en Firebase", e);
                // ESTO ES NUEVO: Si Firebase rechaza el dato, te muestra un pop-up en el celular
                alert("Error al registrar el escaneo en Firebase:\n" + e.message);
                // Igual redirigimos para que el usuario no se quede trabado
                window.location.href = urlFinal;
            }
        }

        procesarEscaneo();
    </script>
</body>
</html>
