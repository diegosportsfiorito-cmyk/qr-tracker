<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Accediendo a tu promoción...</title> <!-- TÍTULO CORREGIDO -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f0f0; }
        .message { text-align: center; padding: 20px; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .aviso-ubicacion { font-size: 0.85em; color: #555; margin-top: 15px; line-height: 1.4; }
    </style>
</head>
<body>
    <div class="message">
        <div class="spinner"></div>
        <p>Verificando enlace, por favor espere...</p>
        <!-- NUEVO TEXTO PERSUASIVO -->
        <div class="aviso-ubicacion">
            💡 <strong>¿Pronto te pediremos tu ubicación?</strong><br>
            Autorízala para acceder a promociones y beneficios exclusivos disponibles en tu zona. ¡Es rápido y seguro!
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBWnsIrC7TwKib6z69y8dELBVEs0Zgov4I",
            authDomain: "qr-tracker-d506d.firebaseapp.com",
            projectId: "qr-tracker-d506d",
            storageBucket: "qr-tracker-d506d.firebasestorage.app",
            messagingSenderId: "718659152932",
            appId: "1:718659152932:web:d3945cdc4a963c5f8e3cb1"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const destinos = {
            "promo1": "https://google.com",
            "promo2": "https://youtube.com",
            "whatsapp1": "https://wa.link/sr53o3"
        };

        const urlParams = new URLSearchParams(window.location.search);
        const qrId = urlParams.get('id') || 'desconocido';
        const urlFinal = destinos[qrId] || "https://google.com";

        let lat = null;
        let lon = null;

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    lat = position.coords.latitude;
                    lon = position.coords.longitude;
                    guardarYRedirigir();
                },
                (error) => {
                    guardarYRedirigir(); 
                },
                { timeout: 5000 } // Subí un poco el tiempo para que alcancen a leer el aviso
            );
        } else {
            guardarYRedirigir();
        }

        function guardarYRedirigir() {
            db.collection('scans').add({
                qrId: qrId,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                userAgent: navigator.userAgent,
                lat: lat,
                lon: lon
            }).then(() => {
                window.location.href = urlFinal;
            }).catch((error) => {
                console.error("Error al guardar: ", error);
                window.location.href = urlFinal;
            });
        }
    </script>
</body>
</html>
